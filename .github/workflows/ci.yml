name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GGML_NO_BACKTRACE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc (CPU, with the model tests)
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            model: true
          - name: linux-clang (CPU)
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            apt: clang-19
          - name: macos-arm64 (Metal, with the model tests)
            os: macos-15
            model: true
          - name: windows-msvc (CPU)
            os: windows-2022
          - name: linux-gcc, muscriptor.cpp's ggml (CPU, with the model tests)
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            model: true
            ggml_fork: true
          - name: macos-arm64, muscriptor.cpp's ggml (Metal, with the model tests)
            os: macos-15
            model: true
            ggml_fork: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Fetch muscriptor.cpp's ggml (the DamRsn/ggml v0.23 fork it pins)
        if: matrix.ggml_fork
        shell: bash
        run: |
          git clone -q https://github.com/DamRsn/ggml.git ggml-fork
          git -C ggml-fork checkout -q b01bbb837ebb3a211e133566324fa7631ee723de
          echo "GGML_ARGS=-DFETCHCONTENT_SOURCE_DIR_GGML=$PWD/ggml-fork" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}; fi
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DDETTATO_VULKAN=OFF $GGML_ARGS

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Tests without weights
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Cache the GGUF
        if: matrix.model
        uses: actions/cache@v4
        with:
          path: models
          key: dettato-gguf-${{ hashFiles('py/fetch.py') }}

      - name: Fetch the GGUF
        if: matrix.model
        run: python3 py/fetch.py models

      - name: Devices
        if: matrix.model
        run: ./build/tools/dettato_cli --list-devices

      - name: Tests with the model (CPU, and the GPU when there is one)
        if: matrix.model
        env:
          DETTATO_TEST_MODEL: ${{ github.workspace }}/models/dettato-f16.gguf
        run: ./build/tests/dettato_tests "[model]" --durations yes

  vulkan:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-vulkan (build only)
          - name: linux-vulkan, muscriptor.cpp's ggml (build only)
            ggml_fork: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan headers, SPIR-V headers and glslc
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev spirv-headers glslc
      - name: Fetch muscriptor.cpp's ggml (the DamRsn/ggml v0.23 fork it pins)
        if: matrix.ggml_fork
        shell: bash
        run: |
          git clone -q https://github.com/DamRsn/ggml.git ggml-fork
          git -C ggml-fork checkout -q b01bbb837ebb3a211e133566324fa7631ee723de
          echo "GGML_ARGS=-DFETCHCONTENT_SOURCE_DIR_GGML=$PWD/ggml-fork" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DDETTATO_VULKAN=ON $GGML_ARGS
      - name: Build
        run: cmake --build build --parallel 4
      - name: Tests without weights
        run: ctest --test-dir build --output-on-failure

  windows-vulkan:
    name: windows-msvc, Vulkan build (no GPU on the runner; with the model tests)
    runs-on: windows-2022
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Vulkan SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UserAgent "Mozilla/5.0"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK installer sha256 is $hash" }
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "--root", "C:\VulkanSDK\$env:VULKAN_SDK_VERSION", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($p.ExitCode -ne 0) { throw "the Vulkan SDK installer exited with $($p.ExitCode)" }

      - name: Configure and build (Ninja, from the Visual Studio environment so ggml's shader generator finds cl)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set VULKAN_SDK=C:\VulkanSDK\%VULKAN_SDK_VERSION%
          cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDETTATO_VULKAN=ON || exit /b 1
          cmake --build build --parallel 4 || exit /b 1

      - name: Is there a Vulkan loader on this machine?
        shell: cmd
        run: where vulkan-1.dll & exit /b 0

      - name: Devices
        run: ./build/tools/dettato_cli --list-devices

      - name: Tests without weights
        run: ctest --test-dir build --output-on-failure

      - name: Cache the GGUF
        uses: actions/cache@v4
        with:
          path: models
          key: dettato-gguf-${{ hashFiles('py/fetch.py') }}

      - name: Fetch the GGUF
        run: python py/fetch.py models

      - name: Tests with the model (Auto must end on the CPU)
        env:
          DETTATO_TEST_MODEL: ${{ github.workspace }}/models/dettato-f16.gguf
        run: ./build/tests/dettato_tests "[model]" --durations yes

  windows-clang-cl:
    name: windows-clang-cl (CPU, with the model tests; the compiler NeuralNote uses)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build (clang-cl and lld-link, Ninja, from the Visual Studio environment)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDETTATO_VULKAN=OFF -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe" || exit /b 1
          cmake --build build --parallel 4 || exit /b 1

      - name: Tests without weights
        run: ctest --test-dir build --output-on-failure

      - name: Cache the GGUF
        uses: actions/cache@v4
        with:
          path: models
          key: dettato-gguf-${{ hashFiles('py/fetch.py') }}

      - name: Fetch the GGUF
        run: python py/fetch.py models

      - name: Tests with the model (CPU)
        env:
          DETTATO_TEST_MODEL: ${{ github.workspace }}/models/dettato-f16.gguf
        run: ./build/tests/dettato_tests "[model]" --durations yes
